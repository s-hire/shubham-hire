<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shubham Hire | Strategy and Business Development</title>
<meta name="description" content="Shubham Hire leads strategy and business development in construction and real estate, across the US and India.">
<meta property="og:title" content="Shubham Hire | Strategy and Business Development">
<meta property="og:description" content="Strategy, business development and capital in construction and real estate, across the US and India.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230F1C2B'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' fill='%23E9E5DC' text-anchor='middle'%3ESH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,300..700&family=Newsreader:opsz,wght@6..72,300..600&display=swap">
<script>
  try { var t = localStorage.getItem("sh-theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
:root{
  --bg:#EEF1F3; --raise:#F8F9FA; --text:#102030; --muted:#4D5D6D; --faint:#6F7D8A;
  --line:rgba(16,32,48,.14); --grid:rgba(16,32,48,.05);
  --brass:#8B6A33; --sky:#2E6E92; --halo:#EEF1F3;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
  --sans:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1C2B; --raise:#142536; --text:#E9E5DC; --muted:#A9B5C1; --faint:#8494A3;
    --line:rgba(233,229,220,.13); --grid:rgba(233,229,220,.045);
    --brass:#C9A66B; --sky:#86B4D4; --halo:#0F1C2B; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1C2B; --raise:#142536; --text:#E9E5DC; --muted:#A9B5C1; --faint:#8494A3;
  --line:rgba(233,229,220,.13); --grid:rgba(233,229,220,.045);
  --brass:#C9A66B; --sky:#86B4D4; --halo:#0F1C2B; color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#EEF1F3; --raise:#F8F9FA; --text:#102030; --muted:#4D5D6D; --faint:#6F7D8A;
  --line:rgba(16,32,48,.14); --grid:rgba(16,32,48,.05);
  --brass:#8B6A33; --sky:#2E6E92; --halo:#EEF1F3; color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 130px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16.5px; line-height:1.6; font-variation-settings:"wdth" 100; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--brass); outline-offset:3px; border-radius:2px}
.vh{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip{position:absolute; left:16px; top:-48px; background:var(--text); color:var(--bg); padding:10px 14px; border-radius:6px; z-index:50; text-decoration:none}
.skip:focus{top:12px}
.wrap{max-width:1160px; margin:0 auto; padding:0 clamp(20px, 4vw, 40px)}
.serif{font-family:var(--serif)}

/* header */
.top{position:sticky; top:env(safe-area-inset-top, 0px); z-index:20; background:var(--bg); background:color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter:blur(10px) saturate(140%); backdrop-filter:blur(10px) saturate(140%); border-bottom:1px solid var(--line)}
.bar{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:24px; min-height:66px}
.mark{display:flex; align-items:center; gap:12px; text-decoration:none}
.mono{width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--text); font-family:var(--serif); font-size:14px; letter-spacing:.04em}
.nm{font-size:15px; font-weight:500}
.tabs{position:relative; display:flex; gap:2px; justify-self:center; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:44px; padding:0 14px; font-size:14.5px; color:var(--muted); white-space:nowrap; transition:color .2s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text)}
.ind{position:absolute; left:0; bottom:0; height:2px; background:var(--brass); transition:transform .35s cubic-bezier(.2,.7,.2,1), width .35s cubic-bezier(.2,.7,.2,1)}
.act{display:flex; align-items:center; gap:10px}
.icon{width:40px; height:40px; display:grid; place-items:center; border-radius:8px; color:var(--muted)}
.icon:hover{color:var(--text); background:var(--grid)}
.btn{display:inline-flex; align-items:center; justify-content:center; height:46px; padding:0 20px; border:1px solid var(--line); border-radius:7px; font-size:15px; font-weight:500; text-decoration:none; transition:background .2s, border-color .2s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--text); color:var(--bg); border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.btn.small{height:38px; padding:0 14px; font-size:14px}

/* panels */
main{min-height:60vh}
.panel{padding:clamp(36px, 6vw, 76px) 0 0; animation:panelIn .32s ease both}
@keyframes panelIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.phead{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px 32px; margin-bottom:30px}
.h2{font-family:var(--serif); font-weight:400; font-size:clamp(32px, 3.8vw, 46px); line-height:1.05; letter-spacing:-.015em; margin:0}
.sub{margin:8px 0 0; color:var(--muted); max-width:56ch}

/* overview */
.hero{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,4fr); gap:clamp(28px, 6vw, 88px); align-items:end}
.name{font-family:var(--serif); font-weight:400; font-size:clamp(50px, 8.2vw, 98px); line-height:.94; letter-spacing:-.03em; margin:0 0 26px; font-variation-settings:"opsz" 72}
.lede{font-family:var(--serif); font-size:clamp(20px, 2.2vw, 25px); line-height:1.42; margin:0 0 22px; max-width:36ch; font-variation-settings:"opsz" 24}
.role{margin:0 0 30px; font-size:15.5px; color:var(--muted); display:flex; flex-direction:column; gap:2px}
.role b{color:var(--text); font-weight:500}
.cta{display:flex; flex-wrap:wrap; gap:12px}
.portrait{position:relative; margin:0; padding:10px; background:var(--raise); border:1px solid var(--line)}
.portrait img{display:block; width:100%; height:auto; aspect-ratio:4/5; object-fit:cover}
.portrait::before,.portrait::after{content:""; position:absolute; width:14px; height:14px; border-color:var(--faint); border-style:solid; opacity:.7}
.portrait::before{left:-8px; top:-8px; border-width:1px 0 0 1px}
.portrait::after{right:-8px; bottom:-8px; border-width:0 1px 1px 0}
.figures{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:40px 44px; margin-top:clamp(48px, 7vw, 84px)}
.fig{font-family:var(--serif); font-size:clamp(31px, 3.7vw, 47px); line-height:1; letter-spacing:-.012em; font-variant-numeric:lining-nums tabular-nums; white-space:nowrap}
.dim{position:relative; height:11px; margin:15px 0 10px}
.dim::before{content:""; position:absolute; left:0; right:0; top:5px; height:1px; background:var(--line); transform-origin:left}
.dim::after{content:""; position:absolute; inset:0; border-left:1px solid var(--faint); border-right:1px solid var(--faint)}
.intro .dim::before{animation:drawX 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d)}
@keyframes drawX{from{transform:scaleX(0)} to{transform:scaleX(1)}}
.cap{font-size:14.5px; color:var(--muted); line-height:1.4}
.education{display:grid; grid-template-columns:minmax(0,3fr) minmax(0,4fr) minmax(0,4fr); gap:22px 40px; margin-top:clamp(52px, 8vw, 96px); padding-top:28px; border-top:1px solid var(--line)}
.h3{font-family:var(--serif); font-weight:400; font-size:24px; margin:0; line-height:1.2}
.ed-s{font-family:var(--serif); font-size:20px; line-height:1.3}
.ed-d{color:var(--text); font-size:15.5px}
.ed-y{color:var(--faint); font-size:14px; font-variant-numeric:tabular-nums}

/* trajectory */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px}
.seg button{height:38px; padding:0 18px; border-radius:7px; color:var(--muted); font-size:14.5px}
.seg button[aria-selected="true"]{background:var(--raise); color:var(--text); box-shadow:inset 0 0 0 1px var(--line)}
.drawing{position:relative; background-color:var(--raise); background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:24px 24px; border:1px solid var(--line); border-radius:4px; min-height:340px; overflow:hidden}
.drawing svg{display:block}
.gl{stroke:var(--line); stroke-width:1}
.gl.dash{stroke-dasharray:3 5}
.ax{fill:var(--faint); font-family:var(--sans); font-size:12.5px}
.xl{fill:var(--text); font-family:var(--sans); font-size:13.5px; font-weight:500}
.xy{fill:var(--faint); font-family:var(--sans); font-size:12.5px}
.trace{fill:none; stroke:var(--text); stroke-width:1.75; stroke-linejoin:round; stroke-linecap:round}
.go .trace{animation:draw 1.25s cubic-bezier(.45,.05,.25,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pt{cursor:pointer}
.pt .hit{fill:transparent}
.pt .dotc{stroke:var(--halo); stroke-width:3; transition:r .2s}
.pt .ring{fill:none; stroke-width:1; opacity:0; transition:opacity .2s}
.pt.sel .ring{opacity:1}
.pt:focus{outline:none}
.pt:focus-visible .ring{opacity:1; stroke:var(--brass)}
.go .pop{opacity:0; animation:pop .45s ease forwards; animation-delay:var(--d)}
@keyframes pop{from{opacity:0} to{opacity:1}}
.vl{fill:var(--text); font-family:var(--serif); font-size:20px; font-variant-numeric:lining-nums}
.vs{fill:var(--muted); font-family:var(--sans); font-size:12.5px}
.caption{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px 32px; align-items:start; padding:22px 2px 0}
.cap-org{font-size:15px; font-weight:500}
.cap-yrs{color:var(--faint); font-size:14px; margin-left:10px}
.cap-val{margin:6px 0 4px}
.cap-val .serif{font-size:26px; margin-right:8px}
.cap-val .muted{color:var(--muted); font-size:14.5px}
.cap-line{margin:0; color:var(--text); max-width:62ch}
.chips{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end}
.chip{height:36px; padding:0 13px; border:1px solid var(--line); border-radius:18px; font-size:13.5px; color:var(--muted)}
.chip[aria-pressed="true"]{color:var(--text); border-color:var(--muted)}
.note{margin:20px 2px 0; font-size:13.5px; color:var(--faint); max-width:78ch}
.path{position:relative; list-style:none; margin:0; padding:6px 0 0}
.path::before{content:""; position:absolute; left:calc(150px + 16px + 11px); top:18px; bottom:22px; width:1px; background:var(--line); transform-origin:top; animation:drawY 1.2s cubic-bezier(.45,.05,.25,1) both}
@keyframes drawY{from{transform:scaleY(0)} to{transform:scaleY(1)}}
.step{display:grid; grid-template-columns:150px 22px minmax(0,1fr); gap:0 16px; padding:13px 0; opacity:0; animation:pop .45s ease forwards; animation-delay:calc(var(--i) * 140ms + 150ms)}
.yr{font-family:var(--serif); font-size:17px; color:var(--muted); text-align:right; padding-top:1px; font-variant-numeric:lining-nums tabular-nums}
.node{width:12px; height:12px; border-radius:50%; margin:7px 0 0 5px; background:var(--c); box-shadow:0 0 0 4px var(--raise); position:relative; z-index:1}
.step.edu .node{background:var(--raise); border:1.5px solid var(--c)}
.step.us{--c:var(--sky)} .step.in{--c:var(--brass)}
.st{font-size:16.5px; font-weight:500; line-height:1.35}
.so{color:var(--muted); font-size:15px}
.ss{color:var(--text); font-size:15px; margin-top:2px; opacity:.86}
.path-box{background:var(--raise); border:1px solid var(--line); border-radius:4px; padding:clamp(18px, 3vw, 34px) clamp(14px, 3vw, 34px)}
.legend{display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:20px; font-size:13.5px; color:var(--muted)}
.lg{display:inline-flex; align-items:center; gap:8px}
.lg::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--c)}
.lg.us{--c:var(--sky)} .lg.in{--c:var(--brass)}
.lg.edu::before{background:transparent; border:1.5px solid var(--muted)}

/* experience */
.xp{display:grid; grid-template-columns:270px minmax(0,1fr); gap:clamp(24px, 5vw, 64px); align-items:start}
.roles{display:flex; flex-direction:column; border-left:1px solid var(--line); position:sticky; top:calc(env(safe-area-inset-top, 0px) + 90px)}
.rl{position:relative; text-align:left; padding:13px 0 13px 18px; color:var(--muted)}
.rl:hover{color:var(--text)}
.rl.on{color:var(--text)}
.rl.on::before{content:""; position:absolute; left:-1px; top:10px; bottom:10px; width:2px; background:var(--brass)}
.rl-c{display:block; font-size:16px; font-weight:500; line-height:1.3}
.rl-d{display:block; font-size:13px; color:var(--faint); margin-top:2px}
.detail{animation:panelIn .28s ease both; min-width:0}
.d-title{font-family:var(--serif); font-weight:400; font-size:clamp(26px, 2.8vw, 34px); line-height:1.15; margin:0 0 8px}
.d-org{font-size:16px; font-weight:500}
.d-desc{color:var(--muted); font-size:15px}
.d-meta{color:var(--faint); font-size:14px; margin-top:2px}
.pts{list-style:none; margin:22px 0 0; padding:0}
.pts li{padding:12px 0; border-top:1px solid var(--line); font-size:15.5px; line-height:1.5}
.pts li:last-child{border-bottom:1px solid var(--line)}
.pts b{font-weight:600}
.sub-org{margin-top:30px}
.sub-org:first-of-type{margin-top:0}
.viz{margin-top:30px; padding:20px 22px 22px; border:1px solid var(--line); border-radius:4px; background:var(--raise)}
.viz-h{font-size:14px; color:var(--muted); margin-bottom:16px}
.bar-t{position:relative; height:12px; border-radius:6px; background:var(--grid); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden}
.bar-f{position:absolute; left:0; top:0; bottom:0; width:var(--w); background:var(--sky); border-radius:6px; transform-origin:left; animation:drawX 1s cubic-bezier(.2,.7,.2,1) both .1s}
.bar-l{display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 18px; margin-top:12px; font-size:14.5px; color:var(--muted)}
.bar-l b{color:var(--text); font-weight:600}
.cols{display:flex; align-items:flex-end; gap:22px; height:150px; padding-left:2px}
.col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:96px}
.col-b{width:56px; height:var(--h); background:var(--line); border-radius:3px 3px 0 0; transform-origin:bottom; animation:growY .9s cubic-bezier(.2,.7,.2,1) both .1s; position:relative}
.col-b.acc{background:var(--sky)}
@keyframes growY{from{transform:scaleY(0)} to{transform:scaleY(1)}}
.col-v{font-family:var(--serif); font-size:20px; margin-bottom:6px; font-variant-numeric:lining-nums}
.col-l{font-size:13.5px; color:var(--muted); margin-top:8px}
.viz-n{font-size:13.5px; color:var(--faint); margin-top:12px}

/* capabilities */
.mx-wrap{overflow-x:auto}
.matrix{width:100%; border-collapse:collapse; min-width:560px; table-layout:fixed}
.matrix thead th:not(:first-child){width:12.4%}
.matrix th,.matrix td{border-top:1px solid var(--line)}
.matrix thead th{border-top:0; font-weight:400; text-align:center; padding:0 6px 12px; vertical-align:bottom}
.matrix thead th:first-child{text-align:left; padding-left:0}
.mc{display:block; font-size:14px; color:var(--text); line-height:1.25}
.my{display:block; font-size:12.5px; color:var(--faint)}
.matrix tbody th{text-align:left; font-weight:400; padding:0}
.matrix thead th:first-child{width:38%}
.matrix tbody th button{display:block; width:100%; text-align:left; padding:15px 12px 15px 0; font-size:15.5px; color:var(--muted); line-height:1.35}
.matrix tbody tr.on th button{color:var(--text); font-weight:500}
.matrix tbody tr:hover th button{color:var(--text)}
.matrix td{text-align:center; padding:0 6px}
.pv{display:none}
.dot{display:inline-block; width:11px; height:11px; border-radius:50%; border:1px solid var(--line)}
.dot.yes{background:var(--muted); border-color:var(--muted)}
tr.on .dot.yes{background:var(--brass); border-color:var(--brass)}
.evidence{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:24px 44px; margin-top:34px; animation:panelIn .28s ease both}
.ev-h{font-family:var(--serif); font-size:19px; margin-bottom:6px}
.ev ul{list-style:none; margin:0; padding:0}
.ev li{padding:9px 0; border-top:1px solid var(--line); font-size:15px; line-height:1.5}
.ev b{font-weight:600}

/* title block */
.tb{margin-top:clamp(56px, 9vw, 104px); padding-bottom:36px}
.tb-grid{display:grid; grid-template-columns:1.7fr 1.35fr 1fr .8fr .8fr; border:1px solid var(--line); border-radius:4px; background:var(--raise)}
.tb-cell{padding:16px 18px; border-left:1px solid var(--line); min-width:0}
.tb-cell:first-child{border-left:0}
.tb-l{font-size:12.5px; color:var(--faint); margin-bottom:4px}
.tb-v{font-size:15px; text-decoration:none; overflow-wrap:anywhere}
a.tb-v:hover{text-decoration:underline}
.tb-name .tb-v{font-family:var(--serif); font-size:22px; line-height:1.2}
.tb-s{font-size:13.5px; color:var(--muted); margin-top:4px; line-height:1.4}
.link{font-size:13.5px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; margin-top:6px}

/* responsive */
@media (max-width: 920px){
  .tb-grid{grid-template-columns:1fr 1fr}
  .tb-cell{border-left:0; border-top:1px solid var(--line)}
  .tb-cell.tb-name{grid-column:1 / -1; border-top:0}
  .tb-cell:nth-child(3),.tb-cell:nth-child(5){border-left:1px solid var(--line)}
  .education{grid-template-columns:1fr 1fr}
  .education .h3{grid-column:1 / -1}
}
@media (max-width: 760px){
  body{font-size:16px}
  .bar{grid-template-columns:1fr auto; grid-template-areas:"mark act" "tabs tabs"; gap:2px 12px; padding-top:8px}
  .mark{grid-area:mark} .act{grid-area:act}
  .tabs{grid-area:tabs; justify-self:stretch; margin:0 -6px}
  .tab{padding:0 8px; font-size:14px; flex:1 0 auto}
  html{scroll-padding-top:calc(env(safe-area-inset-top, 0px) + 150px)}
  .hero{grid-template-columns:1fr; gap:30px}
  .portrait{order:-1; width:min(62%, 260px)}
  .name{margin-bottom:20px}
  .figures{grid-template-columns:repeat(2, minmax(0,1fr)); gap:30px 22px}
  .fig{font-size:clamp(25px, 7.4vw, 32px)}
  .education{grid-template-columns:1fr; gap:18px}
  .caption{grid-template-columns:1fr}
  .cap-val .muted{display:block; margin-top:2px}
  .chips{justify-content:flex-start}
  .path::before{left:calc(11px)}
  .step{grid-template-columns:22px minmax(0,1fr); gap:0 14px}
  .step .yr{grid-column:2; text-align:left; font-size:15.5px}
  .step .node{grid-column:1; grid-row:1 / span 2}
  .step .body{grid-column:2}
  .xp{grid-template-columns:1fr}
  .roles{position:static; flex-direction:row; overflow-x:auto; border-left:0; border-bottom:1px solid var(--line); gap:4px; margin:0 -4px; scrollbar-width:none}
  .roles::-webkit-scrollbar{display:none}
  .rl{padding:10px 12px 12px; white-space:nowrap}
  .rl.on::before{left:12px; right:12px; top:auto; bottom:-1px; height:2px; width:auto}
  .rl-d{display:none}
  .evidence{grid-template-columns:1fr}
  .matrix{min-width:0; table-layout:auto}
  .matrix thead,.matrix td{display:none}
  .matrix tbody th{width:100%}
  .matrix tbody th button{font-size:15.5px; padding:14px 0}
  .pv{display:block; font-size:13.5px; color:var(--faint); margin-top:3px; font-weight:400}
  .matrix tbody tr.on .pv{color:var(--brass)}
  .tb-grid{grid-template-columns:1fr}
  .tb-cell:nth-child(3),.tb-cell:nth-child(5){border-left:0}
}

    var r = roleById(id);
    return html`<section className="panel" aria-labelledby="tab-experience">
      <div className="phead"><h2 className="h2">Experience</h2></div>
      <div className="xp">
        <div className="roles" role="tablist" aria-label="Roles">
          ${ROLES.map(function (x) { var on = x.id === id; return html`<button key=${x.id} role="tab" aria-selected=${on} className=${"rl" + (on ? " on" : "")} onClick=${function () { setId(x.id); }}>
            <span className="rl-c">${x.short}</span><span className="rl-d">${x.dates}</span></button>`; })}
        </div>
        <article className="detail" key=${id}>
          ${r.groups ? html`<div>
              <h3 className="d-title">${r.title}</h3>
              ${r.groups.map(function (g) { return html`<div className="sub-org" key=${g.org}>
                <div className="d-org">${g.org}, ${g.title}</div><div className="d-desc">${g.desc}</div><div className="d-meta">${g.place}, ${g.dates}</div>
                <${Points} points=${g.points} /></div>`; })}
            </div>`
          : html`<div>
              <h3 className="d-title">${r.title}</h3>
              <div className="d-org">${r.company}</div><div className="d-desc">${r.desc}</div><div className="d-meta">${r.place}, ${r.dates}</div>
              <${Points} points=${r.points} />
              ${r.viz === "greystar" ? html`<${GreystarViz} />` : r.viz === "crown" ? html`<${CrownViz} />` : null}
            </div>`}
        </article>
      </div>
    </section>`;
  }

  /* ---------- capabilities ---------- */
  function Capabilities() {
    var s = useState("bd"), cid = s[0], setCid = s[1];
    var cap = CAPS.filter(function (c) { return c.id === cid; })[0];
    return html`<section className="panel" aria-labelledby="tab-capabilities">
      <div className="phead"><div><h2 className="h2">Capabilities</h2><p className="sub">Where each capability has been proven. Select one to see the evidence.</p></div></div>
      <div className="mx-wrap"><table className="matrix">
        <thead><tr><th scope="col"><span className="vh">Capability</span></th>
          ${COLS.map(function (c) { return html`<th scope="col" key=${c[0]}><span className="mc">${c[1]}</span><span className="my">${c[2]}</span></th>`; })}</tr></thead>
        <tbody>${CAPS.map(function (c) { var on = c.id === cid; return html`<tr key=${c.id} className=${on ? "on" : ""}>
          <th scope="row"><button aria-pressed=${on} onClick=${function () { setCid(c.id); }}>${c.name}<span className="pv">${COLS.filter(function (col) { return c.ev[col[0]]; }).map(function (col) { return col[1]; }).join(", ")}</span></button></th>
          ${COLS.map(function (col) { var has = !!c.ev[col[0]]; return html`<td key=${col[0]}><span className=${"dot" + (has ? " yes" : "")} aria-hidden="true"></span><span className="vh">${has ? "Proven" : "Not shown"}</span></td>`; })}
        </tr>`; })}</tbody>
      </table></div>
      <div className="evidence" key=${cid} aria-live="polite">
        ${COLS.filter(function (c) { return cap.ev[c[0]]; }).map(function (c) {
          var r = roleById(c[0]);
          var name = r.groups ? "Early career, US" : r.company;
          return html`<div className="ev" key=${c[0]}><div className="ev-h">${name}</div><ul>
            ${cap.ev[c[0]].map(function (lead) { return findPoints(c[0], lead).map(function (t, k) { return html`<li key=${lead + k}><b>${lead}:</b> ${t}</li>`; }); })}
          </ul></div>`; })}
      </div>
    </section>`;
  }

  /* ---------- title block (contact) ---------- */
  function TitleBlock() {
    var s = useState(""), msg = s[0], setMsg = s[1];
    function copy() {
      function done(t) { setMsg(t); setTimeout(function () { setMsg(""); }, 2400); }
      try { navigator.clipboard.writeText(EMAIL).then(function () { done("Copied"); }, function () { done("Couldn't copy. Select the address instead."); }); }
      catch (x) { done("Couldn't copy. Select the address instead."); }
    }
    return html`<footer id="contact" className="tb wrap" aria-label="Contact">
      <div className="tb-grid">
        <div className="tb-cell tb-name"><div className="tb-l">Name</div><div className="tb-v">Shubham Hire</div><div className="tb-s">Strategy, business development and capital in construction and real estate</div></div>
        <div className="tb-cell"><div className="tb-l">Email</div><a className="tb-v" id="contact-email" href=${"mailto:" + EMAIL}>${EMAIL}</a><div><button className="link" onClick=${copy}>${msg || "Copy email"}</button></div></div>
        <div className="tb-cell"><div className="tb-l">LinkedIn</div><a className="tb-v" href=${LINKEDIN} target="_blank" rel="noopener">linkedin.com/in/sh1p</a></div>
        <div className="tb-cell"><div className="tb-l">Based in</div><div className="tb-v">Mumbai, India</div></div>
        <div className="tb-cell"><div className="tb-l">Updated</div><div className="tb-v">October 2026</div></div>
      </div>
    </footer>`;
  }

  /* ---------- app ---------- */
  function currentTheme() {
    var a = document.documentElement.getAttribute("data-theme");
    if (a === "dark" || a === "light") return a;
    try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (x) { return "light"; }
  }
  function App() {
    var t = useTab(), tab = t[0], go = t[1];
    var s = useState(currentTheme()), theme = s[0], setTheme = s[1];
    function toggleTheme() {
      var next = theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("sh-theme", next); } catch (x) {}
      setTheme(next);
    }
    var body = tab === "trajectory" ? html`<${Trajectory} />` : tab === "experience" ? html`<${Experience} />` : tab === "capabilities" ? html`<${Capabilities} />` : html`<${Overview} />`;
    return html`<${React.Fragment}>
      <${Header} tab=${tab} go=${go} theme=${theme} toggleTheme=${toggleTheme} />
      <main id="main" className="wrap" key=${tab}>${body}</main>
      <${TitleBlock} />
    </${React.Fragment}>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
